    <meta name="color-scheme" content="light dark">
    <script>
        (function() {
            var theme = localStorage.getItem('theme');
            var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var activeTheme = (theme === 'dark' || (!theme && systemDark)) ? 'dark' : 'light';
            if (activeTheme === 'dark') {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
            } else {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
            }
            var meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) {
                meta.content = theme ? theme : 'light dark';
            }
        })();
    </script>

    var $navbar = document.querySelector('#huxblog_navbar');
    var $collapse = document.querySelector('.navbar-collapse');

    $toggle.addEventListener('click', handleMagic)
    function handleMagic(e){
        if ($navbar.className.indexOf('in') > 0) {
        
            $navbar.className = " ";
            
            setTimeout(function(){
                
                if($navbar.className.indexOf('in') < 0) {
                    $collapse.style.height = "0px"
                }
            },400)
        }else{
        
            $collapse.style.height = "auto"
            $navbar.className += " in";
        }
    }
</script>

    const map = L.map('map').setView([41.0, 29.0], 4);
    
    
    const lightTiles = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
    const darkTiles = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
    const attribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>';
    
    
    const isDark = document.documentElement.classList.contains('dark');
    let tileLayer = L.tileLayer(isDark ? darkTiles : lightTiles, {
        attribution: attribution,
        maxZoom: 19
    }).addTo(map);
    
    
    const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            if (mutation.attributeName === 'class') {
                const currentDark = document.documentElement.classList.contains('dark');
                tileLayer.setUrl(currentDark ? darkTiles : lightTiles);
            }
        });
    });
    observer.observe(document.documentElement, { attributes: true });
    
    
    const getMarkerIcon = (isDarkTheme) => {
        const color = isDarkTheme ? '#60a5fa' : '#0085a1';
        const svgHtml = `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2ZM12 11.5C10.62 11.5 9.5 10.38 9.5 9C9.5 7.62 10.62 6.5 12 6.5C13.38 6.5 14.5 7.62 14.5 9C14.5 10.38 13.38 11.5 12 11.5Z" fill="${color}" stroke="#ffffff" stroke-width="1.2"/>
        </svg>`;
        return L.divIcon({
            html: svgHtml,
            iconSize: [30, 30],
            iconAnchor: [15, 30],
            popupAnchor: [0, -30],
            className: 'custom-map-marker'
        });
    };
    
    let markers = [];
    const updateMarkerIcons = (currentDark) => {
        markers.forEach(item => {
            item.marker.setIcon(getMarkerIcon(currentDark));
        });
    };
    
    
    for (const key in travelData) {
        const loc = travelData[key];
        if (loc.lat && loc.lng) {
            const marker = L.marker([loc.lat, loc.lng], {
                icon: getMarkerIcon(document.documentElement.classList.contains('dark'))
            }).addTo(map);
            
            
            let popupContent = '<div class="map-popup-container">';
            popupContent += '<h4 class="map-popup-title">' + loc.name + '</h4>';
            popupContent += '<ul class="map-popup-list">';
            loc.posts.forEach(post => {
                popupContent += '<li><a href="' + post.url + '" class="map-popup-link">' + post.title + '</a> <span class="map-popup-date">(' + post.date + ')</span></li>';
            });
            popupContent += '</ul>';
            popupContent += '</div>';
            
            marker.bindPopup(popupContent);
            markers.push({ marker: marker });
        }
    }
    
    
    const themeObserver = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            if (mutation.attributeName === 'class') {
                const currentDark = document.documentElement.classList.contains('dark');
                updateMarkerIcons(currentDark);
            }
        });
    });
    themeObserver.observe(document.documentElement, { attributes: true });
});

<script type="text/javascript">
    function generateCatalog(selector) {

        
        
        
        
            _containerSelector = 'div.post-container'
        

        
        var P = $(_containerSelector), a, n, t, l, i, c;
        a = P.find('h1,h2,h3,h4,h5,h6');

        
        $(selector).html('')

        
        a.each(function () {
            n = $(this).prop('tagName').toLowerCase();
            i = "#" + $(this).prop('id');
            t = $(this).text();
            c = $('<a href="' + i + '" rel="nofollow" title="' + t + '">' + t + '</a>');
            l = $('<li class="' + n + '_nav"></li>').append(c);
            $(selector).append(l);
        });
        return true;
    }

    generateCatalog(".catalog-body");

    }))
